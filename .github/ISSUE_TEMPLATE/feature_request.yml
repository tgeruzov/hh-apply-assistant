name: Предложить улучшение
description: Предложить новый сценарий или улучшение существующего поведения
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Опишите пользовательскую проблему, а не только желаемую кнопку. Для крупных изменений автоматизации, хранения данных или разрешений браузера объясните ожидаемое безопасное поведение при остановке.

  - type: textarea
    id: problem
    attributes:
      label: Проблема или сценарий
      description: Что сейчас нельзя сделать или приходится делать вручную?
    validations:
      required: true

  - type: textarea
    id: proposed_behavior
    attributes:
      label: Предлагаемое поведение
      description: Как должен выглядеть результат для пользователя?
    validations:
      required: true

  - type: textarea
    id: current_workaround
    attributes:
      label: Текущий обходной способ
      description: Как задача решается сейчас, если решается?

  - type: checkboxes
    id: affected_areas
    attributes:
      label: Возможная область влияния
      options:
        - label: Автоматизация отклика или подтверждение отправки
        - label: Интерфейс или адаптация к размеру окна
        - label: Русский или английский интерфейс
        - label: Сохранённые данные или совместимость
        - label: Диагностика, приватность или разрешения браузера

  - type: textarea
    id: context
    attributes:
      label: Дополнительный контекст
      description: Добавляйте технические примеры только после удаления персональных данных и секретов.

  - type: checkboxes
    id: privacy_check
    attributes:
      label: Проверка данных
      options:
        - label: В описании и приложениях нет персональных данных, cookies, токенов или неотредактированных диагностических отчётов.
          required: true
