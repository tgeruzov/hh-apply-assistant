<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>applomat · Work mode slider 36×30</title>
<style>
  :root {
    --page-bg: #f3f6f9;
    --card-bg: #ffffff;
    --card-border: #dfe6ee;
    --text: #526177;
    --text-strong: #1f2d3f;
    --muted: #91a0b4;
    --red: #ff343c;
    --red-strong: #ff232d;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 28px;
    background: var(--page-bg);
    color: var(--text);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  .demo-shell {
    width: min(390px, 100%);
  }

  .mode-card {
    --track-h: 36px;
    --track-radius: 11px;
    --track-pad: 3px;
    --thumb-w: 44px;
    --thumb-h: 30px;
    --thumb-radius: 10px;
    --thumb-duration: 255ms;
    --turbo-reveal-duration: 380ms;
    --turbo-exit-duration: 220ms;
    --shock-cycle-duration: 5s;
    --turbo-grid-duration: 60s;
    --grid-shift: -320px;
    --move-ease: cubic-bezier(.22, .8, .3, 1);
    --reveal-ease: cubic-bezier(.18, .82, .22, 1);

    /* Static Turbo matrix geometry. Shockwave runs per-cell. */
    --grid-cell: 5px;
    --grid-col-gap: 2px;
    --grid-row-gap: 2px;

    padding: 14px 14px 12px;
    border: 1px solid var(--card-border);
    border-radius: 13px;
    background: var(--card-bg);
    box-shadow: 0 1px 3px rgba(29, 43, 61, .055);
  }

  .mode-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .mode-title {
    min-width: 0;
    display: flex;
    align-items: baseline;
    gap: 7px;
    margin: 0;
    line-height: 1;
    white-space: nowrap;
  }

  .mode-title__label {
    color: var(--text-strong);
    font-size: 12px;
    font-weight: 750;
    letter-spacing: .015em;
    text-transform: uppercase;
  }

  .mode-title__state {
    color: var(--text-strong);
    font-size: 12px;
    font-weight: 700;
    transition: color 170ms ease, opacity 170ms ease;
  }

  .mode-card[data-mode="turbo"] .mode-title__state { color: var(--red-strong); }

  .help-button {
    flex: 0 0 auto;
    width: 20px;
    height: 20px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid #cbd3dd;
    border-radius: 50%;
    background: transparent;
    color: #98a3b2;
    cursor: default;
    font: inherit;
    font-size: 11px;
    font-weight: 750;
    line-height: 1;
  }

  .labels {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    padding: 0 1px;
    color: #91a0b4;
    font-size: 11px;
    font-weight: 650;
    line-height: 1;
  }

  .mode-slider {
    position: relative;
    height: var(--track-h);
    margin-top: 8px;
    overflow: hidden;
    border-radius: var(--track-radius);
    touch-action: none;
    user-select: none;
    cursor: pointer;
    isolation: isolate;
    background: linear-gradient(90deg, #e7e9ed 0%, #e9ebee 55%, #eceef0 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.68),
      inset 0 0 0 1px rgba(27,35,48,.025);
  }

  .mode-slider::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,.12), rgba(255,255,255,.025) 62%, transparent 100%);
  }

  .turbo-surface {
    position: absolute;
    inset: 0;
    z-index: 1;
    border-radius: inherit;
    pointer-events: none;
    opacity: 0;
    background: linear-gradient(
      90deg,
      rgba(255, 83, 91, .12) 0%,
      rgba(255, 75, 83, .23) 27%,
      rgba(255, 65, 74, .43) 55%,
      rgba(255, 52, 62, .69) 79%,
      rgba(255, 42, 52, .89) 100%
    );
    transition:
      opacity var(--turbo-exit-duration) ease;
    will-change: opacity;
  }

  .mode-slider.is-turbo .turbo-surface {
    opacity: 1;
    transition:
      opacity var(--turbo-reveal-duration) cubic-bezier(.22, .72, .22, 1);
  }

  /*
    One continuous 2-period strip instead of two independently justified grids.
    Every column uses a fixed cell + fixed column-gap cadence, so the repeat seam
    is mathematically identical to any other gap in the matrix.
  */
  .grid-mask {
    position: absolute;
    inset: 0;
    z-index: 2;
    overflow: hidden;
    border-radius: inherit;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    color: #fff;
    filter: blur(0);
    will-change: opacity, filter;
    -webkit-mask-image: linear-gradient(
      to right,
      transparent 12%,
      rgba(0,0,0,.20) 32%,
      rgba(0,0,0,.70) 56%,
      #000 72%
    );
    mask-image: linear-gradient(
      to right,
      transparent 12%,
      rgba(0,0,0,.20) 32%,
      rgba(0,0,0,.70) 56%,
      #000 72%
    );
    transition:
      opacity var(--turbo-exit-duration) ease,
      filter var(--turbo-exit-duration) ease,
      visibility 0s linear var(--turbo-exit-duration);
  }

  .mode-slider.is-turbo .grid-mask {
    opacity: .62;
    visibility: visible;
    animation:
      turbo-grid-fade-in calc(var(--turbo-reveal-duration) + 80ms)
      cubic-bezier(.22, .72, .22, 1)
      1 both;
    transition:
      opacity var(--turbo-reveal-duration) ease,
      filter var(--turbo-reveal-duration) ease,
      visibility 0s linear 0s;
  }

  .grid-strip {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    display: grid;
    grid-template-rows: repeat(5, var(--grid-cell));
    grid-auto-flow: column;
    grid-auto-columns: var(--grid-cell);
    align-content: center;
    column-gap: var(--grid-col-gap);
    row-gap: var(--grid-row-gap);
    width: max-content;
    transform: translate3d(0,0,0);
    will-change: transform;
  }

  .mode-slider.is-turbo .grid-strip {
    animation: turbo-grid-drift var(--turbo-grid-duration) linear infinite;
  }

  @keyframes turbo-grid-drift {
    from { transform: translate3d(0,0,0); }
    to   { transform: translate3d(var(--grid-shift),0,0); }
  }

  .grid-cell {
    --wave-boost: 0;
    --wave-x: 0px;
    --wave-y: 0px;
    --wave-scale: 1;

    width: var(--grid-cell);
    height: var(--grid-cell);
    border-radius: 1px;
    background: currentColor;
    opacity: calc(var(--cell-alpha, .15) + var(--wave-boost));
    transform:
      translate3d(
        var(--wave-x),
        var(--wave-y),
        0
      )
      scale(var(--wave-scale));
    transform-origin: center;
    will-change: transform, opacity;
  }

  .grid-cell.l0 { --cell-alpha: 0; }
  .grid-cell.l1 { --cell-alpha: .10; }
  .grid-cell.l2 { --cell-alpha: .20; }
  .grid-cell.l3 { --cell-alpha: .35; }
  .grid-cell.l4 { --cell-alpha: .55; }
  .grid-cell.l5 { --cell-alpha: .75; }

  .shock-front {
    position: absolute;
    z-index: 2;
    top: 3px;
    bottom: 3px;
    left: 0;
    width: 1px;
    border-radius: 1px;
    pointer-events: none;
    opacity: 0;
    background: rgba(255,255,255,.72);
    box-shadow: 0 0 4px rgba(255,255,255,.12);
    transform: translate3d(0,0,0);
    will-change: transform, opacity;
  }

  .mode-slider.is-shock-ignition .slider-thumb {
    scale: .975;
  }

  @keyframes turbo-grid-fade-in {
    0% {
      opacity: 0;
      filter: blur(1.2px);
    }
    55% {
      opacity: .48;
      filter: blur(.45px);
    }
    100% {
      opacity: .62;
      filter: blur(0);
    }
  }

  .snap-markers {
    position: absolute;
    z-index: 3;
    top: 50%;
    left: calc(var(--track-pad) + var(--thumb-w) / 2);
    right: calc(var(--track-pad) + var(--thumb-w) / 2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    transform: translateY(-50%);
    pointer-events: none;
  }

  .snap-marker {
    width: 3px;
    height: 3px;
    flex: 0 0 3px;
    border-radius: 1px;
    background: #7f8b9c;
    opacity: .16;
    transition: opacity 100ms ease;
  }

  .mode-slider:hover:not(.is-turbo) .snap-marker,
  .mode-slider:focus-visible:not(.is-turbo) .snap-marker { opacity: .23; }

  /* Important: the fixed snap dots must NOT sit on top of the Turbo matrix. */
  .mode-slider.is-turbo .snap-marker { opacity: 0; }

  .slider-thumb {
    position: absolute;
    z-index: 5;
    top: var(--track-pad);
    left: var(--track-pad);
    width: var(--thumb-w);
    height: var(--thumb-h);
    border: 1px solid rgba(92,105,122,.11);
    border-radius: var(--thumb-radius);
    background: linear-gradient(180deg, #ffffff 0%, #fbfcfd 100%);
    box-shadow:
      0 3px 7px rgba(27,35,48,.085),
      0 1px 2px rgba(27,35,48,.065),
      inset 0 0 0 1px rgba(255,255,255,.55);
    transform: translate3d(0,0,0);
    transition:
      transform var(--thumb-duration) var(--move-ease),
      box-shadow 150ms ease,
      border-color 170ms ease,
      scale 100ms ease;
    will-change: transform;
    pointer-events: none;
  }

  .mode-slider.is-turbo .slider-thumb {
    border-color: rgba(255,35,45,.34);
  }

  .mode-slider:hover .slider-thumb {
    box-shadow:
      0 4px 9px rgba(27,35,48,.095),
      0 1px 2px rgba(27,35,48,.065),
      inset 0 0 0 1px rgba(255,255,255,.6);
  }

  .mode-slider.is-pressed .slider-thumb { scale: .985; }

  .mode-slider.is-dragging .slider-thumb {
    transition: box-shadow 150ms ease, border-color 170ms ease, scale 100ms ease;
  }

  .mode-slider:focus { outline: none; }

  .mode-slider:focus-visible {
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.68),
      inset 0 0 0 1px rgba(27,35,48,.04),
      0 0 0 2px rgba(255,52,60,.13);
  }

  .limit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid #edf1f5;
  }

  .limit-label {
    color: #526177;
    font-size: 12px;
    font-weight: 500;
  }

  .limit-input {
    width: 72px;
    height: 32px;
    border: 1px solid #dde5ee;
    border-radius: 7px;
    background: #fff;
    color: #1f2d3f;
    font: inherit;
    font-size: 13px;
    font-weight: 750;
    text-align: center;
    outline: none;
  }



  @media (prefers-reduced-motion: reduce) {
    .slider-thumb,
    .turbo-surface,
    .grid-mask,
    .mode-title__state,
    .snap-marker { transition-duration: 1ms !important; }

    .grid-strip { animation: none !important; }
    .shock-front { display: none !important; }
    .grid-cell {
      transform: none !important;
      opacity: var(--cell-alpha, .15) !important;
    }
  }
</style>
</head>
<body>
  <main class="demo-shell">
    <section class="mode-card" id="modeCard" data-mode="turbo" aria-labelledby="modeHeading">
      <div class="mode-header">
        <h1 class="mode-title" id="modeHeading">
          <span class="mode-title__label">WORK MODE</span>
          <span class="mode-title__state" id="currentMode">Turbo</span>
        </h1>
        <span class="help-button" aria-label="Safe, Balanced, Fast and Turbo work modes" title="Safe, Balanced, Fast and Turbo work modes">?</span>
      </div>

      <div class="labels" aria-hidden="true">
        <span>Safe</span>
        <span>Turbo</span>
      </div>

      <div
        class="mode-slider is-turbo"
        id="modeSlider"
        role="slider"
        tabindex="0"
        aria-label="Work mode"
        aria-valuemin="0"
        aria-valuemax="3"
        aria-valuenow="3"
        aria-valuetext="Turbo"
        data-value="3"
      >
        <div class="turbo-surface" aria-hidden="true"></div>
        <div class="grid-mask" aria-hidden="true">
          <div class="grid-strip" id="gridStrip"></div>
        </div>
        <div class="shock-front" id="shockFront" aria-hidden="true"></div>

        <div class="snap-markers" aria-hidden="true">
          <span class="snap-marker"></span>
          <span class="snap-marker"></span>
          <span class="snap-marker"></span>
          <span class="snap-marker"></span>
        </div>

        <div class="slider-thumb" id="sliderThumb" aria-hidden="true"></div>
      </div>

      <div class="limit-row">
        <label class="limit-label" for="limitInput">Application limit per run</label>
        <input class="limit-input" id="limitInput" type="number" min="1" max="500" value="50" />
      </div>
    </section>

  </main>

<script>
(() => {
  const MODES = ["Safe", "Balanced", "Fast", "Turbo"];
  const card = document.getElementById("modeCard");
  const slider = document.getElementById("modeSlider");
  const thumb = document.getElementById("sliderThumb");
  const currentMode = document.getElementById("currentMode");
  const gridStrip = document.getElementById("gridStrip");
  const shockFront = document.getElementById("shockFront");
  const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");

  let value = 3;
  let dragging = false;
  let pointerId = null;
  let pointerStartX = 0;
  let pointerMoved = false;
  let dragX = 0;

  let gridCells = [];
  let gridMetrics = {
    width: 1,
    columns: 1,
    rows: 5,
    periodWidth: 1
  };

  const SHOCK_CYCLE_SECONDS = 5;
  const GRID_DRIFT_SECONDS = 60;

  card.style.setProperty("--shock-cycle-duration", `${SHOCK_CYCLE_SECONDS}s`);
  card.style.setProperty("--turbo-grid-duration", `${GRID_DRIFT_SECONDS}s`);

  let gridDriftAnimation = null;
  let shockCycleSeconds = SHOCK_CYCLE_SECONDS;
  let shockStart = 0;
  let shockTravelMs = 0;
  let shockRafId = 0;
  let shockCycleTimer = 0;
  let shockEntryTimer = 0;
  let shockActive = false;
  let lastShockStartedAt = 0;

  function seededNoise(index) {
    const x = Math.sin(index * 12.9898 + 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  function levelFor(index) {
    const n = seededNoise(index + 91);

    // Regular geometry, irregular deterministic intensity.
    if (n < .18) return "l0";
    if (n < .35) return "l1";
    if (n < .53) return "l2";
    if (n < .69) return "l3";
    if (n < .84) return "l4";
    return "l5";
  }

  function pxVar(name, fallback) {
    const n = parseFloat(getComputedStyle(card).getPropertyValue(name));
    return Number.isFinite(n) ? n : fallback;
  }

  function gaussian(distance, width) {
    const ratio = distance / width;
    return Math.exp(-.5 * ratio * ratio);
  }

  function clamp01(value) {
    return Math.max(0, Math.min(1, value));
  }

  function smoothstep(edge0, edge1, x) {
    if (edge0 === edge1) return x < edge0 ? 0 : 1;
    const t = clamp01((x - edge0) / (edge1 - edge0));
    return t * t * (3 - 2 * t);
  }

  function resetShockCells() {
    for (const cell of gridCells) {
      const style = cell.element.style;
      style.setProperty("--wave-boost", "0");
      style.setProperty("--wave-x", "0px");
      style.setProperty("--wave-y", "0px");
      style.setProperty("--wave-scale", "1");
    }

    if (shockFront) {
      shockFront.style.opacity = "0";
      shockFront.style.transform = "translate3d(0,0,0)";
    }

    slider.classList.remove("is-shock-ignition");
  }

  function rebuildGrid() {
    const rows = 5;
    const cellSize = pxVar("--grid-cell", 5);
    const gap = pxVar("--grid-col-gap", 2);
    const cadence = cellSize + gap;
    const width = Math.max(1, slider.clientWidth);

    // Two exact periods again: this restores the old seamless right-to-left drift.
    const columns = Math.max(1, Math.ceil((width + gap) / cadence) + 2);
    const periodWidth = columns * cadence;
    const fragment = document.createDocumentFragment();
    const metadata = [];

    for (let period = 0; period < 2; period++) {
      for (let column = 0; column < columns; column++) {
        for (let row = 0; row < rows; row++) {
          const index = column * rows + row;
          const baseLevel = levelFor(index);
          const element = document.createElement("span");

          element.className = `grid-cell ${baseLevel}`;
          fragment.appendChild(element);

          metadata.push({
            element,
            column,
            row,
            period,

            // Physical center of THIS rendered cell in the two-period strip.
            // Shockwave uses this together with the live CSS drift offset,
            // so the reaction always happens where the square is actually seen.
            stripX:
              period * periodWidth +
              column * cadence +
              cellSize / 2,

            phase: (seededNoise(index * 1.731 + 17.9) - .5) * .018,
            baseLevel
          });
        }
      }
    }

    gridStrip.replaceChildren(fragment);
    gridStrip.style.width = `${(periodWidth * 2) - gap}px`;
    slider.style.setProperty("--grid-shift", `${-periodWidth}px`);

    gridCells = metadata;
    gridMetrics = {
      width,
      columns,
      rows,
      periodWidth
    };

    refreshGridDriftAnimation();
    resetShockCells();
  }

  function refreshGridDriftAnimation() {
    const animations = gridStrip.getAnimations();
    gridDriftAnimation = animations.length ? animations[0] : null;
  }

  function currentGridDriftOffset() {
    if (!gridDriftAnimation) {
      refreshGridDriftAnimation();
    }

    if (!gridDriftAnimation) {
      return 0;
    }

    const timing = gridDriftAnimation.effect?.getComputedTiming?.();
    const progress = Number.isFinite(timing?.progress)
      ? timing.progress
      : 0;

    return -gridMetrics.periodWidth * progress;
  }

  function travelDurationMs(cycleSeconds = shockCycleSeconds) {
    // The control mostly changes the calm interval.
    // The physical front itself only varies from ~1.8s to ~3.0s.
    const normalized = clamp01((cycleSeconds - 5) / 35);
    return 1800 + normalized * 1200;
  }

  function clearShockTimers() {
    if (shockCycleTimer) {
      clearTimeout(shockCycleTimer);
      shockCycleTimer = 0;
    }

    if (shockEntryTimer) {
      clearTimeout(shockEntryTimer);
      shockEntryTimer = 0;
    }
  }

  function stopShockwave({ clearSchedule = true } = {}) {
    if (shockRafId) {
      cancelAnimationFrame(shockRafId);
      shockRafId = 0;
    }

    if (clearSchedule) {
      clearShockTimers();
    }

    shockActive = false;
    resetShockCells();
  }

  function scheduleNextShockwave() {
    if (value !== 3 || reducedMotionQuery.matches) return;

    if (shockCycleTimer) {
      clearTimeout(shockCycleTimer);
    }

    const intervalMs = Math.max(5000, shockCycleSeconds * 1000);
    const targetTime = lastShockStartedAt
      ? lastShockStartedAt + intervalMs
      : performance.now() + intervalMs;
    const delay = Math.max(300, targetTime - performance.now());

    shockCycleTimer = setTimeout(() => {
      shockCycleTimer = 0;
      startShockwave();
    }, delay);
  }

  function startShockwave({ entry = false } = {}) {
    if (value !== 3 || reducedMotionQuery.matches || !gridCells.length) return;

    if (shockRafId) {
      cancelAnimationFrame(shockRafId);
      shockRafId = 0;
    }

    if (shockCycleTimer) {
      clearTimeout(shockCycleTimer);
      shockCycleTimer = 0;
    }

    shockActive = true;
    shockStart = performance.now();
    lastShockStartedAt = shockStart;
    shockTravelMs = travelDurationMs();

    if (entry) {
      slider.classList.add("is-shock-ignition");
      setTimeout(() => {
        slider.classList.remove("is-shock-ignition");
      }, 120);
    }

    shockRafId = requestAnimationFrame(updateShockwave);
  }

  function updateShockwave(now) {
    if (!shockActive || value !== 3 || reducedMotionQuery.matches) {
      stopShockwave({ clearSchedule: false });
      return;
    }

    const elapsed = now - shockStart;
    const travelProgress = clamp01(elapsed / shockTravelMs);

    // Almost linear propagation with a subtle natural ease at the tail.
    const travelEase = 1 - Math.pow(1 - travelProgress, 1.08);
    const frontX = 1.08 - 1.16 * travelEase;
    const elapsedSeconds = elapsed / 1000;

    // Main wave remains active during travel; wake/echo gets ~950ms to settle.
    const settleMs = 950;
    const globalDecay = elapsed <= shockTravelMs
      ? 1
      : 1 - smoothstep(shockTravelMs, shockTravelMs + settleMs, elapsed);

    // The entire matrix is moving via CSS. Read its current animation phase once
    // and convert every cell's strip-space X into slider-space X.
    const driftOffset = currentGridDriftOffset();
    const sliderWidth = gridMetrics.width;

    for (const cell of gridCells) {
      const visualXPx = cell.stripX + driftOffset;
      const visualX = visualXPx / sliderWidth;
      const x = visualX + cell.phase;
      const distance = x - frontX;

      // Wave moves right -> left:
      // negative distance = just ahead of the front,
      // positive distance = already passed / wake side.
      const core = gaussian(distance, .026) * globalDecay;
      const compression = gaussian(distance + .034, .030) * globalDecay;

      const wakeGate = smoothstep(-.012, .018, distance);
      const wake = gaussian(distance - .075, .105) * wakeGate * globalDecay;

      const echoGate = smoothstep(.035, .075, distance);
      const echo = gaussian(distance - .135, .040) * echoGate * globalDecay;

      // Preserve base l0-l5 opacity and only add a temporary response.
      const boost =
        core * .50 +
        compression * .055 +
        wake * .13 +
        echo * .08;

      const scale =
        1 +
        core * .185 +
        wake * .035 +
        echo * .018 -
        compression * .018;

      // Micro compression/recoil only — no layout-scale displacement.
      const waveX =
        core * -1.05 +
        compression * -.55 +
        wake * .30 +
        echo * .10;

      const interference =
        Math.sin(
          visualX * 19.0 +
          cell.row * 1.27 +
          elapsedSeconds * 6.2 +
          cell.phase * 55
        );

      const echoInterference =
        Math.sin(
          visualX * 14.0 +
          cell.row * 1.61 +
          elapsedSeconds * 4.1
        );

      const waveY =
        interference * wake * .46 +
        echoInterference * echo * .16;

      const style = cell.element.style;
      style.setProperty("--wave-boost", boost.toFixed(3));
      style.setProperty("--wave-x", `${waveX.toFixed(3)}px`);
      style.setProperty("--wave-y", `${waveY.toFixed(3)}px`);
      style.setProperty("--wave-scale", scale.toFixed(3));
    }

    if (shockFront) {
      const frontPx = frontX * gridMetrics.width;
      const frontOpacity =
        travelProgress < 1
          ? Math.min(.34, .34 * globalDecay)
          : .34 * globalDecay;

      shockFront.style.transform = `translate3d(${frontPx.toFixed(2)}px,0,0)`;
      shockFront.style.opacity = Math.max(0, frontOpacity).toFixed(3);
    }

    if (elapsed < shockTravelMs + settleMs) {
      shockRafId = requestAnimationFrame(updateShockwave);
      return;
    }

    shockRafId = 0;
    shockActive = false;
    resetShockCells();
    scheduleNextShockwave();
  }

  function enterTurbo() {
    if (reducedMotionQuery.matches) {
      resetShockCells();
      return;
    }

    clearShockTimers();

    // is-turbo has just been applied; pick up the freshly-created CSS drift
    // animation on the next frame so shockwave shares its exact timeline.
    requestAnimationFrame(() => {
      refreshGridDriftAnimation();
    });

    // Let the thumb/surface start their existing transition, then fire quickly.
    shockEntryTimer = setTimeout(() => {
      shockEntryTimer = 0;
      startShockwave({ entry: true });
    }, 150);
  }

  function exitTurbo() {
    stopShockwave({ clearSchedule: true });
    lastShockStartedAt = 0;
    gridDriftAnimation = null;
  }

  function metrics() {
    const css = getComputedStyle(slider);
    const pad = parseFloat(css.getPropertyValue("--track-pad")) || 3;
    const thumbWidth = thumb.getBoundingClientRect().width;
    const travel = Math.max(0, slider.clientWidth - (pad * 2) - thumbWidth);
    return { pad, thumbWidth, travel };
  }

  function positionForValue(nextValue) {
    return (metrics().travel / 3) * nextValue;
  }

  function setThumbX(x, animate = true) {
    slider.classList.toggle("is-dragging", !animate);
    thumb.style.transform = `translate3d(${x}px, 0, 0)`;
  }

  function syncThumb(animate = true) {
    setThumbX(positionForValue(value), animate);
  }

  function setValue(nextValue, { focus = false } = {}) {
    const previousValue = value;
    value = Math.max(0, Math.min(3, nextValue));

    const name = MODES[value];
    const key = name.toLowerCase();

    slider.dataset.value = String(value);
    slider.classList.toggle("is-turbo", key === "turbo");
    card.dataset.mode = key;
    currentMode.textContent = name;
    slider.setAttribute("aria-valuenow", String(value));
    slider.setAttribute("aria-valuetext", name);

    syncThumb(true);

    if (previousValue !== 3 && value === 3) {
      enterTurbo();
    } else if (previousValue === 3 && value !== 3) {
      exitTurbo();
    }

    if (focus) {
      slider.focus({ preventScroll: true });
    }
  }

  function valueFromPointer(clientX) {
    const rect = slider.getBoundingClientRect();
    const local = Math.max(0, Math.min(rect.width, clientX - rect.left));
    const ratio = rect.width ? local / rect.width : 0;
    return Math.max(0, Math.min(3, Math.floor(ratio * 4)));
  }

  function dragPositionFromPointer(clientX) {
    const rect = slider.getBoundingClientRect();
    const { pad, thumbWidth, travel } = metrics();
    const centered = clientX - rect.left - pad - (thumbWidth / 2);
    return Math.max(0, Math.min(travel, centered));
  }

  function nearestValueForX(x) {
    const { travel } = metrics();
    if (travel <= 0) return 0;
    return Math.max(0, Math.min(3, Math.round((x / travel) * 3)));
  }

  slider.addEventListener("pointerdown", event => {
    if (event.button !== undefined && event.button !== 0) return;

    dragging = true;
    pointerId = event.pointerId;
    pointerStartX = event.clientX;
    pointerMoved = false;

    slider.setPointerCapture?.(pointerId);
    slider.classList.add("is-pressed", "is-dragging");

    dragX = dragPositionFromPointer(event.clientX);
    setThumbX(dragX, false);
  });

  slider.addEventListener("pointermove", event => {
    if (!dragging || event.pointerId !== pointerId) return;

    if (Math.abs(event.clientX - pointerStartX) > 4) {
      pointerMoved = true;
    }

    dragX = dragPositionFromPointer(event.clientX);
    setThumbX(dragX, false);
  });

  function finishPointer(event) {
    if (!dragging || event.pointerId !== pointerId) return;

    dragging = false;
    slider.classList.remove("is-pressed", "is-dragging");
    slider.releasePointerCapture?.(pointerId);
    pointerId = null;

    const target = pointerMoved
      ? nearestValueForX(dragX)
      : valueFromPointer(event.clientX);

    setValue(target, { focus: true });
  }

  slider.addEventListener("pointerup", finishPointer);

  slider.addEventListener("pointercancel", event => {
    if (event.pointerId !== pointerId) return;

    dragging = false;
    pointerId = null;
    slider.classList.remove("is-pressed", "is-dragging");
    syncThumb(true);
  });

  slider.addEventListener("keydown", event => {
    let next = value;

    switch (event.key) {
      case "ArrowLeft":
      case "ArrowDown":
        next = Math.max(0, value - 1);
        break;
      case "ArrowRight":
      case "ArrowUp":
        next = Math.min(3, value + 1);
        break;
      case "Home":
        next = 0;
        break;
      case "End":
        next = 3;
        break;
      default:
        return;
    }

    event.preventDefault();
    setValue(next);
  });

  const resizeObserver = new ResizeObserver(() => {
    const wasTurbo = value === 3;

    if (shockActive) {
      stopShockwave({ clearSchedule: true });
    }

    rebuildGrid();
    syncThumb(false);
    refreshGridDriftAnimation();

    if (wasTurbo && !reducedMotionQuery.matches) {
      clearShockTimers();
      shockEntryTimer = setTimeout(() => {
        shockEntryTimer = 0;
        startShockwave();
      }, 120);
    }

    requestAnimationFrame(() => {
      slider.classList.remove("is-dragging");
    });
  });

  function handleReducedMotionChange() {
    if (reducedMotionQuery.matches) {
      stopShockwave({ clearSchedule: true });
    } else if (value === 3) {
      enterTurbo();
    }
  }

  reducedMotionQuery.addEventListener?.("change", handleReducedMotionChange);

  resizeObserver.observe(slider);
  rebuildGrid();

  requestAnimationFrame(() => {
    syncThumb(false);

    requestAnimationFrame(() => {
      slider.classList.remove("is-dragging");

      // Demo starts in Turbo: produce one initial physical impulse.
      if (value === 3 && !reducedMotionQuery.matches) {
        enterTurbo();
      }
    });
  });
})();
</script>
</body>
</html>
