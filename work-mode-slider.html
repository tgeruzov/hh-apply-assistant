<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Work mode slider</title>

  <style>
    :root {
      --page-bg: #f5f5f6;
      --card-bg: #fbfbfc;
      --card-border: rgba(22, 22, 24, 0.07);
      --text: #76777b;
      --text-strong: #303136;
      --muted: #9b9ca0;
      --red: #ff343c;
      --red-strong: #ff232d;

      --track-h: 56px;
      --track-radius: 18px;
      --track-pad: 4px;
      --thumb-w: 58px;
      --thumb-h: 48px;
      --snap-edge-offset: 33px;

      --thumb-duration: 260ms;
      --turbo-reveal-duration: 220ms;
      --turbo-exit-duration: 160ms;
      --turbo-grid-duration: 5.2s;
      --move-ease: cubic-bezier(.22, .8, .3, 1);
      --turbo-reveal-ease: cubic-bezier(.2, .75, .25, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        linear-gradient(rgba(255,255,255,.46), rgba(255,255,255,.46)),
        var(--page-bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button,
    [role="slider"] {
      font: inherit;
    }

    /* Card / header */

    .work-mode-card {
      width: min(840px, 100%);
      padding: 40px 42px 48px;
      border: 1px solid var(--card-border);
      border-radius: 30px;
      background: rgba(252, 252, 253, 0.97);
      box-shadow:
        0 22px 50px rgba(24, 24, 28, 0.055),
        0 2px 7px rgba(24, 24, 28, 0.035);
    }

    .work-mode-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .work-mode-title {
      display: flex;
      align-items: baseline;
      gap: 14px;
      min-width: 0;
      margin: 0;
      letter-spacing: -0.035em;
      white-space: nowrap;
      font-size: clamp(27px, 3.4vw, 34px);
      font-weight: 420;
      line-height: 1.05;
    }

    .work-mode-title__label {
      color: #727378;
    }

    .work-mode-title__state {
      color: var(--text-strong);
      font-weight: 500;
      transition:
        color 170ms ease,
        opacity 170ms ease;
    }

    .work-mode-card[data-mode="turbo"] .work-mode-title__state {
      color: var(--red-strong);
    }

    .help-button {
      position: relative;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 2px solid #c2c3c6;
      border-radius: 999px;
      background: transparent;
      color: #a7a8ac;
      cursor: pointer;
      font-size: 21px;
      font-weight: 600;
      line-height: 1;
      transition:
        border-color 150ms ease,
        color 150ms ease,
        background-color 150ms ease;
    }

    .help-button:hover {
      color: #8e8f93;
      border-color: #a9aaad;
      background: rgba(0, 0, 0, 0.015);
    }

    .help-button:focus-visible {
      outline: 3px solid rgba(255, 52, 60, 0.20);
      outline-offset: 4px;
    }

    /* Labels */

    .work-mode-labels {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 72px;
      color: #76777b;
      font-size: clamp(23px, 3vw, 29px);
      font-weight: 420;
      line-height: 1;
      letter-spacing: -0.025em;
    }

    /* Slider surface */

    .work-mode-slider {
      position: relative;
      height: var(--track-h);
      margin-top: 28px;
      border-radius: var(--track-radius);
      overflow: hidden;
      touch-action: none;
      user-select: none;
      cursor: pointer;
      isolation: isolate;
      background:
        linear-gradient(90deg, #dedfe2 0%, #e4e4e6 44%, #e9e9ea 100%);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.58),
        inset 0 0 0 1px rgba(26, 26, 28, 0.025);
    }

    .work-mode-slider::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(
          90deg,
          rgba(255,255,255,.04) 0%,
          rgba(255,255,255,.10) 18%,
          rgba(255,255,255,.04) 42%,
          rgba(255,255,255,0) 62%
        );
    }

    .warm-layer,
    .turbo-surface {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    .warm-layer {
      z-index: 1;
      opacity: 0;
      visibility: hidden;
    }

    .turbo-surface {
      z-index: 2;
      opacity: 0;
      transform: scaleX(0);
      transform-origin: 100% 50%;
      background:
        linear-gradient(
          90deg,
          rgba(255, 70, 78, 0.14) 0%,
          rgba(255, 69, 77, 0.32) 21%,
          rgba(255, 60, 69, 0.54) 46%,
          rgba(255, 50, 60, 0.74) 72%,
          rgba(255, 42, 52, 0.92) 100%
        );
      transition:
        transform var(--turbo-exit-duration) var(--turbo-reveal-ease),
        opacity var(--turbo-exit-duration) ease;
    }

    .work-mode-slider.is-turbo .turbo-surface {
      opacity: 1;
      transform: scaleX(1);
      transition-duration: var(--turbo-reveal-duration);
    }

    /* Contribution grid */

    .base-grid,
    .turbo-grid-mask {
      position: absolute;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      border-radius: inherit;
      pointer-events: none;
    }

    .base-grid {
      opacity: 0;
      visibility: hidden;
      color: #7b7c81;
    }

    .grid-copy {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: repeat(6, 4px);
      grid-auto-flow: column;
      grid-auto-columns: 4px;
      align-content: center;
      justify-content: space-between;
      row-gap: 4px;
    }

    .grid-cell {
      width: 4px;
      height: 4px;
      border-radius: 1.25px;
      background: currentColor;
      opacity: var(--cell-alpha, .18);
    }

    .base-grid .grid-copy {
      padding: 0 9px;
    }

    .base-grid .grid-cell.l0 { --cell-alpha: .13; }
    .base-grid .grid-cell.l1 { --cell-alpha: .28; }
    .base-grid .grid-cell.l2 { --cell-alpha: .46; }
    .base-grid .grid-cell.l3 { --cell-alpha: .68; }

    .turbo-grid-mask {
      opacity: 0;
      visibility: hidden;
      clip-path: inset(0 0 0 100%);
      color: #fff;
      transition:
        clip-path var(--turbo-exit-duration) var(--turbo-reveal-ease),
        opacity var(--turbo-exit-duration) ease,
        visibility 0s linear var(--turbo-exit-duration);
    }

    .work-mode-slider.is-turbo .turbo-grid-mask {
      opacity: .67;
      visibility: visible;
      clip-path: inset(0 0 0 0);
      transition:
        clip-path var(--turbo-reveal-duration) var(--turbo-reveal-ease),
        opacity var(--turbo-reveal-duration) ease,
        visibility 0s linear 0s;
    }

    .turbo-grid-strip {
      position: absolute;
      inset: 0 auto 0 0;
      width: 200%;
      display: flex;
      will-change: transform;
    }

    .turbo-grid-strip .grid-copy {
      flex: 0 0 50%;
      padding: 0 10px;
    }

    .turbo-grid-strip .grid-cell.l0 { --cell-alpha: .10; }
    .turbo-grid-strip .grid-cell.l1 { --cell-alpha: .22; }
    .turbo-grid-strip .grid-cell.l2 { --cell-alpha: .38; }
    .turbo-grid-strip .grid-cell.l3 { --cell-alpha: .66; }

    .work-mode-slider.is-turbo .turbo-grid-strip {
      animation: turbo-grid-drift var(--turbo-grid-duration) linear infinite;
    }

    @keyframes turbo-grid-drift {
      from { transform: translate3d(0, 0, 0); }
      to   { transform: translate3d(-50%, 0, 0); }
    }


    /* Snap position markers */

    .snap-markers {
      position: absolute;
      z-index: 4;
      top: 50%;
      left: var(--snap-edge-offset);
      right: var(--snap-edge-offset);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .snap-marker {
      width: 4px;
      height: 4px;
      flex: 0 0 4px;
      border-radius: 1px;
      background: #85868a;
      opacity: .20;
      transition: opacity 150ms ease;
    }

    .work-mode-slider:hover .snap-marker,
    .work-mode-slider:focus-visible .snap-marker {
      opacity: .28;
    }

    .work-mode-slider.is-turbo .snap-marker {
      opacity: .14;
    }

    .work-mode-slider.is-turbo:hover .snap-marker,
    .work-mode-slider.is-turbo:focus-visible .snap-marker {
      opacity: .20;
    }

    /* Thumb */

    .slider-thumb {
      position: absolute;
      z-index: 6;
      top: var(--track-pad);
      left: var(--track-pad);
      width: var(--thumb-w);
      height: var(--thumb-h);
      border-radius: 15px;
      background:
        linear-gradient(180deg, #ffffff 0%, #fbfbfc 100%);
      box-shadow:
        0 4px 10px rgba(25, 25, 28, 0.10),
        0 1px 2px rgba(25, 25, 28, 0.08),
        inset 0 0 0 1px rgba(25, 25, 28, 0.028);
      transform: translate3d(0, 0, 0);
      transition:
        transform var(--thumb-duration) var(--move-ease),
        box-shadow 150ms ease,
        scale 100ms ease;
      will-change: transform;
      pointer-events: none;
    }

    .work-mode-slider:hover .slider-thumb {
      box-shadow:
        0 5px 12px rgba(25, 25, 28, 0.12),
        0 1px 2px rgba(25, 25, 28, 0.08),
        inset 0 0 0 1px rgba(25, 25, 28, 0.045);
    }

    .work-mode-slider.is-pressed .slider-thumb {
      scale: .985;
    }

    .work-mode-slider.is-dragging .slider-thumb {
      transition:
        box-shadow 150ms ease,
        scale 100ms ease;
    }

    /* States */

    .work-mode-slider[data-value="0"],
    .work-mode-slider[data-value="1"],
    .work-mode-slider[data-value="2"],
    .work-mode-slider[data-value="3"] {
      background:
        linear-gradient(90deg, #dedfe2 0%, #e4e4e6 44%, #e9e9ea 100%);
    }

    /* Motion */

    @media (prefers-reduced-motion: reduce) {
      .slider-thumb,
      .warm-layer,
      .turbo-surface,
      .turbo-grid-mask,
      .work-mode-title__state {
        transition-duration: 1ms !important;
      }

      .turbo-grid-strip {
        animation: none !important;
      }
    }

    /* Accessibility */

    .work-mode-slider:focus {
      outline: none;
    }

    .work-mode-slider:focus-visible {
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.58),
        inset 0 0 0 1px rgba(26, 26, 28, 0.04),
        0 0 0 3px rgba(255, 52, 60, 0.17);
    }

    .hit-zone {
      position: absolute;
      inset-block: 0;
      z-index: 5;
      width: 25%;
      pointer-events: none;
    }

    .hit-zone:nth-of-type(1) { left: 0%; }
    .hit-zone:nth-of-type(2) { left: 25%; }
    .hit-zone:nth-of-type(3) { left: 50%; }
    .hit-zone:nth-of-type(4) { left: 75%; }

    @media (max-width: 640px) {
      :root {
        --track-h: 52px;
        --thumb-w: 54px;
        --thumb-h: 44px;
        --snap-edge-offset: 31px;
      }

      body {
        padding: 18px;
      }

      .work-mode-card {
        padding: 28px 24px 34px;
        border-radius: 24px;
      }

      .work-mode-title {
        gap: 10px;
      }

      .work-mode-labels {
        margin-top: 56px;
      }

      .work-mode-slider {
        margin-top: 24px;
      }
    }
  </style>
</head>

<body>
  <section class="work-mode-card" data-mode="turbo" aria-labelledby="work-mode-heading">
    <!-- Card / header -->
    <header class="work-mode-header">
      <h1 class="work-mode-title" id="work-mode-heading">
        <span class="work-mode-title__label">Work mode</span>
        <span class="work-mode-title__state" id="currentMode">Turbo</span>
      </h1>

      <button
        class="help-button"
        type="button"
        aria-label="About work modes"
        title="Safe, Balanced, Fast and Turbo work modes"
      >?</button>
    </header>

    <!-- Labels -->
    <div class="work-mode-labels" aria-hidden="true">
      <span>Safe</span>
      <span>Turbo</span>
    </div>

    <!-- Slider surface -->
    <div
      class="work-mode-slider is-turbo"
      id="workModeSlider"
      role="slider"
      tabindex="0"
      aria-label="Work mode"
      aria-valuemin="0"
      aria-valuemax="3"
      aria-valuenow="3"
      aria-valuetext="Turbo"
      data-value="3"
    >
      <div class="warm-layer" aria-hidden="true"></div>
      <div class="turbo-surface" aria-hidden="true"></div>

      <!-- Contribution grid -->
      <div class="base-grid" aria-hidden="true">
        <div class="grid-copy" id="baseGrid"></div>
      </div>

      <div class="turbo-grid-mask" aria-hidden="true">
        <div class="turbo-grid-strip" id="turboGridStrip">
          <div class="grid-copy" id="turboGridA"></div>
          <div class="grid-copy" id="turboGridB"></div>
        </div>
      </div>


      <!-- Four subtle fixed snap positions -->
      <div class="snap-markers" aria-hidden="true">
        <div class="snap-marker"></div>
        <div class="snap-marker"></div>
        <div class="snap-marker"></div>
        <div class="snap-marker"></div>
      </div>

      <!-- Invisible 25% interaction zones -->
      <span class="hit-zone" aria-hidden="true"></span>
      <span class="hit-zone" aria-hidden="true"></span>
      <span class="hit-zone" aria-hidden="true"></span>
      <span class="hit-zone" aria-hidden="true"></span>

      <!-- Thumb -->
      <div class="slider-thumb" id="sliderThumb" aria-hidden="true"></div>
    </div>
  </section>

  <script>
    (() => {
      const modes = ["Safe", "Balanced", "Fast", "Turbo"];

      const card = document.querySelector(".work-mode-card");
      const slider = document.getElementById("workModeSlider");
      const thumb = document.getElementById("sliderThumb");
      const currentMode = document.getElementById("currentMode");

      const baseGrid = document.getElementById("baseGrid");
      const turboGridA = document.getElementById("turboGridA");
      const turboGridB = document.getElementById("turboGridB");

      // State
      let value = 3;
      let dragging = false;
      let pointerId = null;
      let dragX = 0;
      let pointerStartX = 0;
      let pointerMoved = false;

      // Deterministic pseudo-random source for a stable matrix pattern
      function seededNoise(index) {
        const x = Math.sin(index * 12.9898 + 78.233) * 43758.5453;
        return x - Math.floor(x);
      }

      function levelFor(index, turbo = false) {
        const n = seededNoise(index + (turbo ? 91 : 0));

        // Keep enough "empty" cells so it does not become a checkerboard.
        if (n < 0.28) return "l0";
        if (n < 0.56) return "l1";
        if (n < 0.82) return "l2";
        return "l3";
      }

      function buildGrid(target, columns, turbo = false) {
        target.textContent = "";

        const rows = 6;
        const count = columns * rows;

        for (let i = 0; i < count; i++) {
          const cell = document.createElement("span");
          cell.className = `grid-cell ${levelFor(i, turbo)}`;
          target.appendChild(cell);
        }
      }

      function rebuildGrids() {
        const width = slider.clientWidth;

        // ~8 px cadence: 4 px cell + visual spacing.
        const columns = Math.max(28, Math.ceil(width / 8));

        buildGrid(baseGrid, columns, false);
        buildGrid(turboGridA, columns, true);

        // Clone exactly so the scrolling loop is seamless.
        turboGridB.replaceChildren(
          ...Array.from(turboGridA.children, node => node.cloneNode(true))
        );
      }

      // Position
      function metrics() {
        const style = getComputedStyle(slider);
        const pad = parseFloat(style.getPropertyValue("--track-pad")) || 4;
        const thumbWidth = thumb.getBoundingClientRect().width;
        const travel = Math.max(0, slider.clientWidth - (pad * 2) - thumbWidth);

        return { pad, thumbWidth, travel };
      }

      function positionForValue(nextValue) {
        const { travel } = metrics();
        return (travel / 3) * nextValue;
      }

      function setThumbX(x, animate = true) {
        if (animate) {
          slider.classList.remove("is-dragging");
        } else {
          slider.classList.add("is-dragging");
        }

        thumb.style.transform = `translate3d(${x}px, 0, 0)`;
      }

      function syncThumb(animate = true) {
        setThumbX(positionForValue(value), animate);
      }

      // Turbo animation state + UI state
      function setValue(nextValue, { focus = false } = {}) {
        nextValue = Math.max(0, Math.min(3, nextValue));

        value = nextValue;

        const name = modes[value];
        const key = name.toLowerCase();

        slider.dataset.value = String(value);
        slider.classList.toggle("is-turbo", key === "turbo");
        card.dataset.mode = key;
        currentMode.textContent = name;

        slider.setAttribute("aria-valuenow", String(value));
        slider.setAttribute("aria-valuetext", name);

        syncThumb(true);

        if (focus) {
          slider.focus({ preventScroll: true });
        }

        slider.dispatchEvent(
          new CustomEvent("workmodechange", {
            bubbles: true,
            detail: { value, mode: name }
          })
        );
      }

      function valueFromPointer(clientX) {
        const rect = slider.getBoundingClientRect();
        const local = Math.max(0, Math.min(rect.width, clientX - rect.left));
        const ratio = rect.width ? local / rect.width : 0;

        // Four invisible 25% hit zones.
        return Math.max(0, Math.min(3, Math.floor(ratio * 4)));
      }

      function dragPositionFromPointer(clientX) {
        const rect = slider.getBoundingClientRect();
        const { pad, thumbWidth, travel } = metrics();

        const centered = clientX - rect.left - pad - (thumbWidth / 2);
        return Math.max(0, Math.min(travel, centered));
      }

      function nearestValueForX(x) {
        const { travel } = metrics();

        if (travel <= 0) return 0;

        return Math.max(
          0,
          Math.min(3, Math.round((x / travel) * 3))
        );
      }

      // Click handling / drag
      slider.addEventListener("pointerdown", event => {
        if (event.button !== undefined && event.button !== 0) return;

        dragging = true;
        pointerId = event.pointerId;
        pointerStartX = event.clientX;
        pointerMoved = false;
        slider.setPointerCapture?.(pointerId);

        slider.classList.add("is-pressed", "is-dragging");

        dragX = dragPositionFromPointer(event.clientX);
        setThumbX(dragX, false);
      });

      slider.addEventListener("pointermove", event => {
        if (!dragging || event.pointerId !== pointerId) return;

        if (Math.abs(event.clientX - pointerStartX) > 4) {
          pointerMoved = true;
        }

        dragX = dragPositionFromPointer(event.clientX);
        setThumbX(dragX, false);
      });

      function finishPointer(event) {
        if (!dragging || event.pointerId !== pointerId) return;

        dragging = false;
        slider.classList.remove("is-pressed", "is-dragging");

        slider.releasePointerCapture?.(pointerId);
        pointerId = null;

        // A tap uses the four invisible 25% hit zones.
        // A real drag snaps the physical thumb to the nearest discrete stop.
        const target = pointerMoved
          ? nearestValueForX(dragX)
          : valueFromPointer(event.clientX);

        setValue(target, { focus: true });
      }

      slider.addEventListener("pointerup", finishPointer);
      slider.addEventListener("pointercancel", event => {
        if (event.pointerId !== pointerId) return;

        dragging = false;
        pointerId = null;
        slider.classList.remove("is-pressed", "is-dragging");
        syncThumb(true);
      });

      // Keyboard
      slider.addEventListener("keydown", event => {
        let next = value;

        switch (event.key) {
          case "ArrowLeft":
          case "ArrowDown":
            next = Math.max(0, value - 1);
            break;

          case "ArrowRight":
          case "ArrowUp":
            next = Math.min(3, value + 1);
            break;

          case "Home":
            next = 0;
            break;

          case "End":
            next = 3;
            break;

          default:
            return;
        }

        event.preventDefault();
        setValue(next);
      });

      // Resize / initial layout
      const resizeObserver = new ResizeObserver(() => {
        rebuildGrids();
        syncThumb(false);
        requestAnimationFrame(() => slider.classList.remove("is-dragging"));
      });

      resizeObserver.observe(slider);

      rebuildGrids();

      requestAnimationFrame(() => {
        syncThumb(false);
        requestAnimationFrame(() => {
          slider.classList.remove("is-dragging");
        });
      });
    })();
  </script>
</body>
</html>
