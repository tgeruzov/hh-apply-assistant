            }

            const iconMarkup = {
                minimize: `<span class="ar-icon-svg" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.75 8.25 10 12.5l4.25-4.25" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`,
                help: `<span class="ar-icon-svg" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M8.6 7.75a1.94 1.94 0 1 1 2.49 2.87c-.7.28-1.09.8-1.09 1.43" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="14.35" r=".9" fill="currentColor"/></svg></span>`,
                remove: `<span class="ar-icon-svg" aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.25 4.75h5.5M8 4.75v-.5A1.25 1.25 0 0 1 9.25 3h1.5A1.25 1.25 0 0 1 12 4.25v.5m-6 1.5h8l-.52 8.06A1.5 1.5 0 0 1 11.98 16H8.02a1.5 1.5 0 0 1-1.5-1.69L6 6.25Z" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.85 8.75v4.1M11.15 8.75v4.1" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"/></svg></span>`
            };
            const setIconButton = (id, markup, label) => {
                const node = el(id);
                if (!node) return;
                node.classList.add('ar-icon-only');
                node.innerHTML = markup;
                node.title = label;
                node.setAttribute('aria-label', label);
            };

            const minimizeTitle = I18n.t('panel.minimizeTitle');
            setIconButton('ar-minimize-btn', iconMarkup.minimize, minimizeTitle);
            setIconButton('ar-minimize-diag-btn', iconMarkup.minimize, minimizeTitle);
            setIconButton('ar-work-mode-help-btn', iconMarkup.help, I18n.t('panel.modeHelpAria'));

            const currentPresetKey = PRESETS[config.preset] ? config.preset : DEFAULT_PRESET;
            const modeLabel = presetLabel(currentPresetKey);
            const modeState = el('ar-work-mode-state');
            if (modeState) {
                modeState.classList.remove('is-changing');
                modeState.textContent = modeLabel;
                void modeState.offsetWidth;
                modeState.classList.add('is-changing');
            }
            const safeLabel = el('ar-work-mode-lbl-safe');
            if (safeLabel) safeLabel.textContent = I18n.t('panel.modeScaleSlower');
            const turboLabel = el('ar-work-mode-lbl-turbo');
            if (turboLabel) turboLabel.textContent = I18n.t('panel.modeScaleFaster');

            const slider = el('ar-work-mode-slider');
            if (slider) {
                slider.setAttribute('aria-label', I18n.t('panel.modeTitle'));
                slider.setAttribute('aria-valuetext', modeLabel);
            }
            const help = el('ar-work-mode-help-btn');
            if (help) {
                help.setAttribute('aria-label', I18n.t('panel.modeHelpAria'));
                help.title = I18n.t('panel.modeHelpAria');
            }
            const cover = el('ar-cover-text');
            if (cover) cover.placeholder = I18n.t('cover.placeholder');

            setStatus(currentStatusState.statusKey, currentStatusState.customKeyOrText, currentStatusState.params);
            StatsView.render();
            ManualQueueView.render();
            DiagnosticsView.refresh();
        }

        function mount({ el: getEl, panel: rootPanel, uiSignal }) {
            el = getEl;
            panel = rootPanel;
            qa('.ar-lang-btn', panel).forEach(btn => {
                btn.addEventListener('click', (event) => {
                    event.stopPropagation();
                    const targetLang = btn.dataset.lang;
                    if (!targetLang || targetLang === I18n.getLanguage()) return;
                    I18n.setLanguage(targetLang);
                    refresh();
                    log(I18n.t('logs.modeSet', { mode: presetLabel(config.preset) }));
                }, { signal: uiSignal });
            });
        }

        function destroy() {
            el = null;
            panel = null;
        }

        return { mount, refresh, destroy };
    })();

    let uiAbortController = null;
    let mockRunTimer = null;

    function cleanupUI(){
      WorkModeSlider.destroy();
      LocalizationBinder.destroy();
      DiagnosticsView.destroy();
      StatsView.destroy();
      ManualQueueView.destroy();
      if(uiAbortController){ try{uiAbortController.abort();}catch(e){} uiAbortController=null; }
      document.getElementById('ar-toggle-btn')?.remove();
      document.getElementById('ar-main-panel')?.remove();
      if(mockRunTimer){ clearInterval(mockRunTimer); mockRunTimer=null; }
    }

    function mockStart(){
      if(State.amIRunning()) return;
      State.setRunning(true);
      setStatus('running');
      log(I18n.getLanguage()==='ru' ? 'Mock-запуск начат.' : 'Mock run started.');
      if(mockRunTimer) clearInterval(mockRunTimer);
      mockRunTimer=setInterval(()=>{
        if(!State.amIRunning()) return;
        MOCK_STATE.sentCount += 1;
        MOCK_STATE.stats.success += 1;
        const n=MOCK_STATE.stats.success + MOCK_STATE.stats.manual + MOCK_STATE.stats.skipped;
        if(n % 5 === 0) MOCK_STATE.stats.skipped += 1;
        if(n % 7 === 0) MOCK_STATE.stats.manual += 1;
        StatsView.render();
        if(MOCK_STATE.sentCount >= config.limit){
          State.setRunning(false);
          clearInterval(mockRunTimer); mockRunTimer=null;
          setStatus('done');
          log(I18n.getLanguage()==='ru' ? 'Mock-лимит достигнут.' : 'Mock limit reached.');
        }
      },1200);
    }

    function mockStop(){
      State.setRunning(false);
      if(mockRunTimer){clearInterval(mockRunTimer);mockRunTimer=null;}
      setStatus('stopped');
      log(I18n.getLanguage()==='ru' ? 'Mock-запуск остановлен.' : 'Mock run stopped.');
    }

    function setupUI(){
      if(document.getElementById('ar-main-panel') || !document.body) return;
      cleanupUI();
      uiAbortController=new AbortController();
      const uiSignal=uiAbortController.signal;
      injectPanelStyles();

      const lang=I18n.getLanguage();
      const toggleBtn=document.createElement('button');
      toggleBtn.id='ar-toggle-btn'; toggleBtn.type='button'; toggleBtn.setAttribute('lang',lang);
      toggleBtn.innerHTML='<span class="ar-tab-text">Apply Assistant</span>';
      toggleBtn.title=I18n.t('panel.expandTitle');
      toggleBtn.setAttribute('aria-label',I18n.t('panel.expandTitle'));
      toggleBtn.style.display='none';
      document.body.appendChild(toggleBtn);

      const panel=document.createElement('div');
      panel.id='ar-main-panel'; panel.setAttribute('lang',lang); panel.innerHTML=buildPanelHtml();
      document.body.appendChild(panel);
      const el=(id)=>document.getElementById(id);

      el('ar-cover-text').value=config.coverText;
      el('ar-use-cover-check').checked=config.useCover;
      el('ar-apply-reject-check').checked=config.applyOnRejectWarning;
      el('ar-limit-input').value=config.limit;
      setStatus(State.amIRunning() ? 'running':'idle');

      const coverArea=el('ar-cover-text');
      const coverCounter=el('ar-cover-counter');
      const renderCoverState=()=>{
        const on=el('ar-use-cover-check').checked;
        coverArea.disabled=!on;
        if(coverCounter){
          const len=(coverArea.value||'').length;
          coverCounter.textContent=`${len} / 5000`;
          coverCounter.classList.toggle('is-near',len>=4800);
          coverCounter.classList.toggle('is-off',!on);
        }
      };
      coverArea.addEventListener('input',renderCoverState,{signal:uiSignal});
      el('ar-use-cover-check').addEventListener('change',renderCoverState,{signal:uiSignal});
      renderCoverState();

      WorkModeSlider.mount({el,uiSignal});

      const helpWrap=el('ar-work-mode-help-wrap');
      const helpBtn=el('ar-work-mode-help-btn');
      const helpPopover=el('ar-work-mode-popover');
      if(helpWrap && helpBtn && helpPopover){
        let helpPinned=false;
        let helpHover=false;
        let helpFocus=false;
        let escapeClosed=false;
        const renderHelpPopover=()=>{
          const open=!escapeClosed && (helpPinned || helpHover || helpFocus);
          helpWrap.classList.toggle('is-pinned',helpPinned);
          helpWrap.classList.toggle('is-open',open);
          helpBtn.setAttribute('aria-expanded',open?'true':'false');
          helpPopover.setAttribute('aria-hidden',open?'false':'true');
        };
        helpWrap.addEventListener('mouseenter',()=>{helpHover=true;escapeClosed=false;renderHelpPopover();},{signal:uiSignal});
        helpWrap.addEventListener('mouseleave',()=>{helpHover=false;renderHelpPopover();},{signal:uiSignal});
        helpWrap.addEventListener('focusin',()=>{helpFocus=true;escapeClosed=false;renderHelpPopover();},{signal:uiSignal});
        helpWrap.addEventListener('focusout',()=>{setTimeout(()=>{helpFocus=helpWrap.contains(document.activeElement);renderHelpPopover();},0);},{signal:uiSignal});
        helpBtn.addEventListener('click',(event)=>{
          event.stopPropagation();
          escapeClosed=false;
          helpPinned=!helpPinned;
          renderHelpPopover();
        },{signal:uiSignal});
        document.addEventListener('click',(event)=>{
          if(helpPinned && !helpWrap.contains(event.target)){
            helpPinned=false;
            renderHelpPopover();
          }
        },{signal:uiSignal});
        document.addEventListener('keydown',(event)=>{
          if(event.key==='Escape' && (helpPinned || helpHover || helpFocus)){
            helpPinned=false;
            escapeClosed=true;
            renderHelpPopover();
          }
        },{signal:uiSignal});
      }

      const saveSettings=()=>{
        config=Settings.normalize({
          ...config,
          coverText:el('ar-cover-text').value,
          useCover:el('ar-use-cover-check').checked,
          applyOnRejectWarning:el('ar-apply-reject-check').checked,
          limit:el('ar-limit-input').value
        });
        el('ar-limit-input').value=config.limit;
        Settings.save(config);
        log(I18n.t('logs.settingsSaved'));
        StatsView.render();
      };
      ['ar-cover-text','ar-use-cover-check','ar-apply-reject-check','ar-limit-input']
        .forEach(id=>el(id)?.addEventListener('change',saveSettings,{signal:uiSignal}));

      DiagnosticsView.mount({el,uiSignal});
      ManualQueueView.mount({el});
      StatsView.mount();
      LocalizationBinder.mount({el,panel,uiSignal});

      el('ar-start-btn').onclick=mockStart;
      el('ar-stop-btn').onclick=mockStop;
      el('ar-reset-history').onclick=()=>{
        if(confirm(I18n.t('confirm.resetHistory'))){
          State.clearProcessedIDs();
          State.resetSentCount();
          Stats.reset();
          StatsView.render();
          log(I18n.t('logs.historyReset'));
        }
      };

      const root=document.documentElement;
      const toggleVisibility=(isOpen)=>{
        panel.style.display=isOpen?'flex':'none';
        toggleBtn.style.display=isOpen?'none':'flex';
        root.classList.toggle('hha-open',isOpen);
      };
      el('ar-minimize-btn').onclick=()=>toggleVisibility(false);
      if(el('ar-minimize-diag-btn')) el('ar-minimize-diag-btn').onclick=()=>toggleVisibility(false);
      toggleBtn.onclick=()=>toggleVisibility(true);

      toggleVisibility(true);
      setTimeout(()=>root.classList.add('hha-anim'),60);
    }

    const PanelController={mount:setupUI,destroy:cleanupUI};
    window.addEventListener('DOMContentLoaded',()=>PanelController.mount(),{once:true});
    if(document.readyState!=='loading') PanelController.mount();

    window.hhaUiLab = {
      mock: MOCK_STATE,
      setStatus,
      start: mockStart,
      stop: mockStop,
      reset(){
        MOCK_STATE.sentCount=9;
        MOCK_STATE.stats={success:9,manual:2,skipped:3,startedAt:Date.now()-1000*60*18};
        setStatus('idle');
        StatsView.render();
      }
    };

})();
</script>
</body>
<!--
UI_MAP
0. REDESIGN: Work Mode language v4 — unified geometry/material/press physics plus a persistent adaptive execution dock.
1. EXTRACTED: original panel CSS/design tokens, buildPanelHtml markup, WorkMode/Turbo visual controller, Manual Queue, Stats, Diagnostics, language bindings and UI states.
2. MOCK DATA: MOCK_STATE + State/Stats/DiagLog/Metrics/Settings adapters inside the script. Start/Stop and diagnostics are visual simulations only.
3. UI/BACKEND BOUNDARY: no hh.ru automation loop, API/fetch/XHR, DOM vacancy processing, navigation, locks, captcha handling or business logic is included. The original userscript is untouched.
